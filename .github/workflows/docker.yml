name: Build e pubblica immagini Docker

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Backend
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/mnb1999/document-manager-backend:latest

      - name: Frontend (Caddy)
        uses: docker/build-push-action@v6
        with:
          context: src/main/frontend
          push: true
          tags: ghcr.io/mnb1999/document-manager-web:latest
