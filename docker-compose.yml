services:
  backend:
    image: ghcr.io/mnb1999/document-manager-backend:latest
    env_file: .env
    restart: unless-stopped

  web:
    image: ghcr.io/mnb1999/document-manager-web:latest
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
